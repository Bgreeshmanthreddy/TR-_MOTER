<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | TR Motors</title>

    <link rel="stylesheet" href="admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="topbar">

        <a href="/" class="brand">
            <img src="images/tr.jpeg" alt="TR Motors">
            <span>TR <b>MOTORS</b></span>
        </a>

        <span class="badge">Admin</span>

        <div class="topbar-actions">

            <a href="/" class="ghost-link">View site</a>

            <div class="who" id="who" hidden>
                <span class="avatar" id="whoAvatar"></span>
                <span class="who-email" id="whoEmail"></span>
                <button type="button" class="ghost-btn" id="signOutBtn">
                    Sign out
                </button>
            </div>

        </div>

    </header>


    <main>

        <section class="gate" id="gate" hidden>

            <p class="eyebrow">TR MOTORS STAFF</p>

            <h1 id="gateTitle">Checking access…</h1>

            <p id="gateText"></p>

            <a class="btn" href="/" id="gateAction" hidden>Back to site</a>

        </section>


        <div id="dashboard" hidden>

            <div class="page-head">

                <div>
                    <p class="eyebrow">CUSTOMER DATA</p>
                    <h1>Dashboard</h1>
                </div>

                <button type="button" class="ghost-btn refresh" id="refreshBtn">
                    Refresh
                </button>

            </div>


            <div class="stats">

                <article class="stat">
                    <span>Customers</span>
                    <strong id="statUsers">—</strong>
                </article>

                <article class="stat">
                    <span>Car bookings</span>
                    <strong id="statOrders">—</strong>
                </article>

                <article class="stat">
                    <span>Pending bookings</span>
                    <strong id="statPending">—</strong>
                </article>

                <article class="stat">
                    <span>Test drives</span>
                    <strong id="statBookings">—</strong>
                </article>

            </div>


            <section class="panel">

                <div class="panel-head">

                    <div>
                        <h2>Customers</h2>
                        <p id="userCount">Loading…</p>
                    </div>

                    <input type="search" id="search"
                        placeholder="Search name or email" autocomplete="off">

                </div>

                <div class="table-wrap">

                    <table>

                        <thead>
                            <tr>
                                <th>Customer</th>
                                <th>Email</th>
                                <th>Joined</th>
                                <th>Last login</th>
                                <th>Orders</th>
                                <th>Drives</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody id="userRows"></tbody>

                    </table>

                </div>

                <p class="empty" id="usersEmpty" hidden>
                    No customers match that search.
                </p>

            </section>

        </div>

    </main>


    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

    <aside class="drawer" id="drawer" hidden aria-labelledby="drawerName">

        <header class="drawer-head">

            <div>
                <p class="eyebrow">CUSTOMER</p>
                <h2 id="drawerName">—</h2>
                <p id="drawerEmail" class="drawer-email"></p>
            </div>

            <button type="button" class="drawer-close" id="drawerClose"
                aria-label="Close">
                &times;
            </button>

        </header>

        <div id="drawerBody"></div>

    </aside>


    <script src="js/admin.js" defer></script>

</body>

</html>
